# Compatibility identifier: keep the legacy Compose project name so existing
# deployments retain their ownership labels during upgrades.
name: unraid-codex-terminal

services:
  codex-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CODEX_TERMINAL_IMAGE:-ghcr.io/shepemer/unraid-addons-codex-terminal:dev}
    container_name: codex-terminal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_CHROOT
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /run:rw,nosuid,size=64m
      - /var/run:rw,nosuid,size=64m
    ports:
      - "${CODEX_SSH_PORT:-2222}:2222/tcp"
      - "${CODEX_WEBUI_PORT:-7681}:7681/tcp"
    environment:
      SSH_AUTHORIZED_KEYS: ${SSH_AUTHORIZED_KEYS:-}
      SSH_PASSWORD_LOGIN: ${SSH_PASSWORD_LOGIN:-false}
      SSH_PASSWORD: ${SSH_PASSWORD:-}
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:-}
      AUTO_LAUNCH_CODEX: ${AUTO_LAUNCH_CODEX:-true}
      CODEX_WEBUI_BYPASS_APPROVALS: ${CODEX_WEBUI_BYPASS_APPROVALS:-true}
      CODEX_MEDIA_PATH_MAPS: ${CODEX_MEDIA_PATH_MAPS:-}
      UNRAID_MCP_BEARER_TOKEN: ${UNRAID_MCP_BEARER_TOKEN:-}
      MEDIA_MCP_BEARER_TOKEN: ${MEDIA_MCP_BEARER_TOKEN:-}
      UTILITIES_MCP_BEARER_TOKEN: ${UTILITIES_MCP_BEARER_TOKEN:-}
    volumes:
      - ${CODEX_CONFIG_DIR:-./data/codex-terminal}:/config:rw
      # Optional diagnostic mounts must be narrow. Media stays read-only;
      # downloads may be read/write for intentional archive work.
      # - /var/log:/mnt/unraid/logs:ro
      # - /boot/config/plugins/dockerMan/templates-user:/mnt/unraid/docker-templates:ro
      # Add media/download mounts only through long bind syntax with
      # bind.create_host_path=false and exact-case existing host paths.
    networks:
      - codex-mgmt
    depends_on:
      unraid-mcp:
        condition: service_started

  unraid-mcp:
    build:
      context: .
      dockerfile: Dockerfile.unraid-mcp
      args:
        UNRAID_MCP_VERSION: "1.2.4"
    image: ${UNRAID_MCP_IMAGE:-ghcr.io/shepemer/unraid-addons-unraid-mcp:1.2.4-dev}
    container_name: unraid-mcp
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /run:rw,nosuid,size=32m
    environment:
      UNRAID_API_URL: ${UNRAID_API_URL:-}
      UNRAID_API_KEY: ${UNRAID_API_KEY:-}
      UNRAID_MCP_BEARER_TOKEN: ${UNRAID_MCP_BEARER_TOKEN:-}
    volumes:
      - ${UNRAID_MCP_STATE_DIR:-./data/unraid-mcp/state}:/home/mcp/.unraid-mcp:rw
      - ${UNRAID_MCP_LOG_DIR:-./data/unraid-mcp/logs}:/app/logs:rw
    networks:
      - codex-mgmt

  media-mcp:
    profiles:
      - media
      - issue-agent
    build:
      context: .
      dockerfile: Dockerfile.media-mcp
    image: ${MEDIA_MCP_IMAGE:-ghcr.io/shepemer/unraid-addons-media-mcp:dev}
    container_name: media-mcp
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      MEDIA_MCP_BEARER_TOKEN: ${MEDIA_MCP_BEARER_TOKEN:-}
      MEDIA_MCP_MEDIA_ROOTS: ${MEDIA_MCP_MEDIA_ROOTS:-}
      MEDIA_MCP_PATH_MAPS: ${MEDIA_MCP_PATH_MAPS:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      TAUTULLI_URL: ${TAUTULLI_URL:-}
      TAUTULLI_API_KEY: ${TAUTULLI_API_KEY:-}
      TRACEARR_URL: ${TRACEARR_URL:-}
      TRACEARR_API_KEY: ${TRACEARR_API_KEY:-}
      THREADFIN_URL: ${THREADFIN_URL:-}
      THREADFIN_USERNAME: ${THREADFIN_USERNAME:-}
      THREADFIN_PASSWORD: ${THREADFIN_PASSWORD:-}
      THREADFIN_TOKEN: ${THREADFIN_TOKEN:-}
      BAZARR_URL: ${BAZARR_URL:-}
      BAZARR_API_KEY: ${BAZARR_API_KEY:-}
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      QBITTORRENT_URL: ${QBITTORRENT_URL:-}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
      NZBGET_URL: ${NZBGET_URL:-}
      NZBGET_USERNAME: ${NZBGET_USERNAME:-}
      NZBGET_PASSWORD: ${NZBGET_PASSWORD:-}
      SEERR_URL: ${SEERR_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
    # Direct file access is optional and intentionally has no default host path.
    # Add docker-compose.media-paths.yml.example only after setting exact-case,
    # existing host paths in MEDIA_MCP_DOWNLOADS_DIR and MEDIA_MCP_MEDIA_DIR.
    networks:
      - codex-mgmt

  media-issue-agent:
    profiles:
      - issue-agent
    build:
      context: .
      dockerfile: Dockerfile.media-issue-agent
    image: ${ISSUE_AGENT_IMAGE:-ghcr.io/shepemer/unraid-addons-media-issue-agent:dev}
    container_name: media-issue-agent
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    ports:
      - "${ISSUE_AGENT_WEBUI_PORT:-6983}:6983/tcp"
    environment:
      ISSUE_AGENT_MEDIA_MCP_BEARER_TOKEN: ${ISSUE_AGENT_MEDIA_MCP_BEARER_TOKEN:-}
      ISSUE_AGENT_WEB_PASSWORD: ${ISSUE_AGENT_WEB_PASSWORD:-}
      ISSUE_AGENT_PUSHOVER_APP_TOKEN: ${ISSUE_AGENT_PUSHOVER_APP_TOKEN:-}
      ISSUE_AGENT_PUSHOVER_USER_KEY: ${ISSUE_AGENT_PUSHOVER_USER_KEY:-}
      ISSUE_AGENT_SLACK_ENABLED: ${ISSUE_AGENT_SLACK_ENABLED:-false}
      ISSUE_AGENT_SLACK_APP_TOKEN: ${ISSUE_AGENT_SLACK_APP_TOKEN:-}
      ISSUE_AGENT_SLACK_BOT_TOKEN: ${ISSUE_AGENT_SLACK_BOT_TOKEN:-}
      ISSUE_AGENT_SLACK_CHANNEL_ID: ${ISSUE_AGENT_SLACK_CHANNEL_ID:-}
      ISSUE_AGENT_OPENAI_MODERATION_API_KEY: ${ISSUE_AGENT_OPENAI_MODERATION_API_KEY:-}
    volumes:
      - ${ISSUE_AGENT_CONFIG_DIR:-./data/media-issue-agent}:/config:rw
    networks:
      - codex-mgmt
    depends_on:
      media-mcp:
        condition: service_started

  utilities-mcp:
    profiles:
      - utilities
    build:
      context: .
      dockerfile: Dockerfile.utilities-mcp
    image: ${UTILITIES_MCP_IMAGE:-ghcr.io/shepemer/unraid-addons-utilities-mcp:dev}
    container_name: utilities-mcp
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      UTILITIES_MCP_BEARER_TOKEN: ${UTILITIES_MCP_BEARER_TOKEN:-}
      SCRUTINY_URL: ${SCRUTINY_URL:-}
    networks:
      - codex-mgmt

networks:
  codex-mgmt:
    name: codex-mgmt
    driver: bridge
